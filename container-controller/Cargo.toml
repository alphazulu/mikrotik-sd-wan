[package]
name = "sdwan-router-controller"
version = "0.2.0"
edition = "2021"
publish = false

[features]
default = []
web = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
