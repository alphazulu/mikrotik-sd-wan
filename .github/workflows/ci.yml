name: Checks and scratch images

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Unit tests and schemas
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m compileall -q sdwan tools configurator.py sdwan.py
          python sdwan.py --config config/sdwan.json validate
          python sdwan.py --config config/examples/clients-applications.json validate
          python sdwan.py --config config/examples/container.json validate
          python sdwan.py --config config/sdwan.json bundle --output build/native
          python sdwan.py --config config/examples/container.json bundle --output build/container
          python tools/audit_public_tree.py
      - name: Offline Windows GUI
        if: runner.os == 'Windows'
        shell: bash
        run: python tests/gui_wizard_regression.py
      - name: Scan Git history for secrets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  images:
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_HOME: ${{ github.workspace }}/runtime/toolchains/rustup
      CARGO_HOME: ${{ github.workspace }}/runtime/toolchains/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/runtime/container-build
      RUSTC: ${{ github.workspace }}/runtime/toolchains/cargo/bin/rustc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned local Rust SDK
        shell: bash
        run: |
          mkdir -p runtime/toolchains
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 https://sh.rustup.rs -o runtime/toolchains/rustup-init.sh
          sh runtime/toolchains/rustup-init.sh -y --no-modify-path --default-toolchain 1.99.1
          runtime/toolchains/cargo/bin/rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv5te-unknown-linux-musleabi
      - name: Rust tests and three static images
        run: |
          runtime/toolchains/cargo/bin/cargo test --locked --manifest-path container-controller/Cargo.toml
          python3 container-controller/build.py
          python3 tests/container_artifact_acceptance.py
          python3 tools/release_checksums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scratch-images
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/container/*.tar.gz
            dist/container/build-report.json
            dist/container/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [python, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scratch-images
          path: release
      - name: Verify and publish this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes SHA256SUMS build-report.json sdwan-controller-amd64.tar.gz sdwan-controller-arm64.tar.gz sdwan-controller-armv5.tar.gz
