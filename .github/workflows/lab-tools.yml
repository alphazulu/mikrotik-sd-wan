name: External lab tools

on:
  push:
    paths: ['labtools/**', 'lte-rndis-emu/**', '.github/workflows/lab-tools.yml']
  pull_request:
    paths: ['labtools/**', 'lte-rndis-emu/**', '.github/workflows/lab-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labtools-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: External tool unit tests
        working-directory: labtools
        run: /usr/bin/python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Synthetic API replay
        working-directory: labtools
        run: /usr/bin/python3 snapshot_matrix.py --source .. --output "$RUNNER_TEMP/sdwan-snapshot.json"
      - name: Real Tk widget replay
        working-directory: labtools
        run: xvfb-run -a /usr/bin/python3 gui_replay.py --source .. --output "$RUNNER_TEMP/sdwan-gui"
